# Example Apache VirtualHost. Adapt domain, paths and TLS before use.
<VirtualHost *:80>
    ServerName static-lab.example.com
    DocumentRoot /var/www/web-server-static
    <Directory /var/www/web-server-static>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    DirectoryIndex index.html
    ErrorDocument 404 /404.html
    ErrorDocument 500 /500.html
    Redirect 302 /temporary-redirect /redirect.html
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json image/svg+xml
    </IfModule>
    <IfModule mod_headers.c>
        <FilesMatch "\.(css|js|svg|woff2)$">
            Header set Cache-Control "public, max-age=604800"
        </FilesMatch>
        <FilesMatch "\.(html)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>
    ErrorLog ${APACHE_LOG_DIR}/web-server-static-error.log
    CustomLog ${APACHE_LOG_DIR}/web-server-static-access.log combined
</VirtualHost>
