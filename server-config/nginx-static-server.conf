# Example Nginx server block. Adapt domain, paths and TLS before use.
server {
    listen 80;
    server_name static-lab.example.com;
    root /var/www/web-server-static;
    index index.html;
    access_log /var/log/nginx/web-server-static-access.log;
    error_log /var/log/nginx/web-server-static-error.log;
    autoindex off;
    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;
    location = /404.html { internal; }
    location = /500.html { internal; }
    location = /temporary-redirect { return 302 /redirect.html; }
    location ~* \.(css|js|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location ~* \.(html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
